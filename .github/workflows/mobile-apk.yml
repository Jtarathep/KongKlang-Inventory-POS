name: Build mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/android-preview/**'
      - '.github/workflows/mobile-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build installable APK
        working-directory: mobile/android-preview
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KONGKLANG-mobile-demo-apk
          path: mobile/android-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
