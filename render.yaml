services:
  - type: web
    name: kongklang-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: KONGKLANG_DB_URL
        sync: false
      - key: KONGKLANG_DB_USER
        sync: false
      - key: KONGKLANG_DB_PASSWORD
        sync: false
