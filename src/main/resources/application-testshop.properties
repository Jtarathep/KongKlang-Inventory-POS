# Explicit test-shop profile: use a reviewed COPY of the database, never the live shop.
spring.datasource.url=${KONGKLANG_TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/kongklang_test?useSSL=false&serverTimezone=Asia/Bangkok&characterEncoding=UTF-8}
spring.datasource.username=${KONGKLANG_TEST_DB_USER}
spring.datasource.password=${KONGKLANG_TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
app.bootstrap.enabled=false
