<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head>
<meta name="csrf-token" th:content="${session.csrfToken}">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>เอกสารสต็อก · คงคลัง</title><link rel="stylesheet" href="/css/vendor/bootstrap.min.css"><link rel="stylesheet" href="/css/kongklang.css"><link rel="stylesheet" href="/css/business.css"><link rel="stylesheet" href="/css/ui.css?v=20261112">
<link rel="stylesheet" href="/css/web-refresh.css?v=20261120"><script src="/js/web-refresh.js?v=20261118" defer></script></head>
<body class="kk-layout"><div th:replace="~{fragments/navigation :: sidebar}"></div><div th:replace="~{fragments/navigation :: topbar}"></div>
<main class="business-main"><h1>เอกสารสต็อก</h1><nav class="business-tabs" aria-label="ส่วนงาน"><a href="/reports/overview">รายงานภาพรวม</a><a href="/stock/operations">เอกสารสต็อก</a><a href="/accounting">เจ้าหนี้และบัญชี</a></nav>
<p>ค้นหาเอกสารรับเข้า เบิกออก ตรวจนับ และยอดตั้งต้น พร้อมผู้ทำรายการและล็อตที่เปลี่ยนแปลง</p>
<form method="get" class="business-form"><label>ตั้งแต่วันที่<input type="date" name="start" th:value="${start}" required></label><label>ถึงวันที่<input type="date" name="end" th:value="${end}" required></label><label>รหัสสินค้า<input name="code" th:value="${code}" maxlength="255"></label><div class="form-actions"><button type="submit">ค้นหาเอกสาร</button></div></form>
<section class="business-section"><h2>ผลการค้นหา</h2><p th:text="|พบ ${documents.totalElements} เอกสาร|"></p><div class="table-scroll" tabindex="0" role="region" aria-label="เอกสารสต็อก"><table><thead><tr><th>เลขที่ / วันที่</th><th>ประเภท</th><th>สินค้า</th><th class="numeric">ก่อน → หลัง</th><th>เหตุผล</th></tr></thead><tbody><tr th:each="d : ${documents.content}"><td><a th:href="@{/stock/operations/{id}(id=${d.id})}" th:text="${d.number}"></a><br><span th:text="${#temporals.format(d.createdAt,'dd/MM/yyyy HH:mm')}"></span></td><td th:text="${d.kind}"></td><td th:text="|${d.productCode} · ${d.productName}|"></td><td class="numeric" th:text="|${d.quantityBefore} → ${d.quantityAfter}|"></td><td th:text="${d.note}"></td></tr><tr th:if="${documents.empty}"><td colspan="5">ไม่พบเอกสาร ลองเปลี่ยนช่วงวันที่หรือรหัสสินค้า</td></tr></tbody></table></div>
<nav class="business-tabs" aria-label="หน้าผลลัพธ์"><a th:if="${documents.hasPrevious()}" th:href="@{/stock/operations(start=${start},end=${end},code=${code},page=${documents.number - 1})}">หน้าก่อน</a><span th:text="|หน้า ${documents.number + 1}|"></span><a th:if="${documents.hasNext()}" th:href="@{/stock/operations(start=${start},end=${end},code=${code},page=${documents.number + 1})}">หน้าถัดไป</a></nav></section>

</main><div th:replace="~{fragments/navigation :: navigation-script}"></div></body></html>
