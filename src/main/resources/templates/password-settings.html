<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปลี่ยนรหัสผ่าน | KONGKLANG</title><link rel="stylesheet" href="/css/vendor/bootstrap.min.css"><link rel="stylesheet" href="/css/ui.css"><link rel="stylesheet" href="/css/commerce.css"><link rel="stylesheet" href="/css/web-refresh.css?v=20261120"><script src="/js/web-refresh.js?v=20261118" defer></script></head>
<body class="kk-layout"><div th:replace="~{fragments/navigation :: sidebar}"></div><div th:replace="~{fragments/navigation :: topbar}"></div><main class="container-xl commerce-page"><h1>เปลี่ยนรหัสผ่าน</h1><p th:if="${session.passwordChangeRequired}" class="alert alert-info" role="status">บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณาเปลี่ยนก่อนทำงานในร้าน</p><p>หลังเปลี่ยนรหัสผ่าน ระบบจะให้เข้าสู่ระบบใหม่และยกเลิกการใช้งานจากเซสชันเดิม</p><p th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></p>
<form method="post" action="/settings/password" class="commerce-settings"><input type="hidden" name="_csrf" th:value="${session.csrfToken}"><label for="current">รหัสผ่านปัจจุบัน</label><input id="current" name="current" type="password" autocomplete="current-password" required class="form-control"><label for="next">รหัสผ่านใหม่</label><input id="next" name="next" type="password" autocomplete="new-password" required minlength="12" class="form-control"><p class="form-text">อย่างน้อย 12 ตัวอักษร และไม่เกิน 72 ไบต์</p><label for="confirm">ยืนยันรหัสผ่านใหม่</label><input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="12" class="form-control"><div class="commerce-actions mt-4"><button type="submit" class="btn btn-primary">บันทึกรหัสผ่านใหม่</button></div></form></main><div th:replace="~{fragments/navigation :: navigation-script}"></div></body></html>
