# Set DB credentials in the hosting dashboard, never in source control.
spring.datasource.url=${KONGKLANG_DB_URL}
spring.datasource.username=${KONGKLANG_DB_USER}
spring.datasource.password=${KONGKLANG_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
# The local model runs on the developer's PC, not on the free web host.
# Store-scoped deterministic KK AI answers remain available.
kk.ai.local.enabled=false
spring.jpa.hibernate.ddl-auto=validate
app.bootstrap.enabled=false
app.system-admin.bootstrap=false
