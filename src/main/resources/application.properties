spring.application.name=kongklang
spring.datasource.url=${KONGKLANG_DB_URL:jdbc:mysql://127.0.0.1:3306/kongklang?serverTimezone=Asia/Bangkok&characterEncoding=UTF-8}
spring.datasource.username=${KONGKLANG_DB_USER:}
spring.datasource.password=${KONGKLANG_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${KONGKLANG_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap.enabled=false
app.system-admin.bootstrap=false

# Product photo upload: decoded and resized on the server.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
