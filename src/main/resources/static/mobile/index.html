<!DOCTYPE html>
<html lang="th">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KONGKLANG store workspace">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kongklang_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>คงคลัง | KONGKLANG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="barcode-camera.css">
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img src="assets/assets/kongklang-logo.png" alt="" width="124" height="124">
    <strong>KONGKLANG</strong><span>กำลังเตรียมพื้นที่ทำงานของร้าน</span>
    <progress aria-label="กำลังโหลด"></progress>
    <button hidden id="app-retry" onclick="location.reload()">เชื่อมต่อใหม่</button>
  </div>
  <style>
    #app-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:linear-gradient(145deg,#f8fbff,#e3edff);font:16px system-ui;color:#173b75}
    #app-loading strong{font-size:26px;letter-spacing:2px}#app-loading span{font-size:14px}#app-loading img{object-fit:contain}#app-loading progress{width:120px;height:4px;accent-color:#2563eb}
    #app-retry{border:0;border-radius:24px;padding:12px 24px;background:#2563eb;color:white;font:inherit}
  </style>
  <script>
    window.addEventListener('flutter-first-frame',()=>document.getElementById('app-loading')?.remove(),{once:true});
    setTimeout(()=>{const button=document.getElementById('app-retry');if(button)button.hidden=false;},15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="vendor/zxing-browser.min.js" defer></script>
  <script src="barcode-camera.js" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
